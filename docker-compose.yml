# ============================================================
# 知库 · 企业知识库平台 —— 中间件一键编排
# 覆盖：MySQL 8.0 / Redis 7 / RabbitMQ 3.13 / Elasticsearch 8.18
# 启动：docker compose up -d
# ============================================================
name: kb-platform

services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    ports:
      - "${KB_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: kb_system
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - kb-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: kb-redis
    restart: unless-stopped
    ports:
      - "${KB_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "redis1234", "--appendonly", "yes"]
    volumes:
      - kb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kb-rabbitmq
    restart: unless-stopped
    ports:
      - "${KB_RABBITMQ_PORT:-5672}:5672"
      - "${KB_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kbadmin
      RABBITMQ_DEFAULT_PASS: kb123456
    volumes:
      - kb-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.18.1
    container_name: kb-elasticsearch
    restart: unless-stopped
    ports:
      - "${KB_ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - kb-es-data:/usr/share/elasticsearch/data

volumes:
  kb-mysql-data:
  kb-redis-data:
  kb-rabbitmq-data:
  kb-es-data:
